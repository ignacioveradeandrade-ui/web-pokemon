<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Legendarios</title>
  <link rel="stylesheet" href="../static/legendarios.css" />
</head>
<body>
  <main class="container">
    <h1 class="page-title">Pokémon Legendarios</h1>

    <section class="cards" aria-label="Lista de Pokémon legendarios">

      <!-- Mewtwo -->
      <article class="card legendary">
        <div class="card-image">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/150.png" alt="Mewtwo">
        </div>
        <div class="card-body">
          <h2 class="pokemon-name">Mewtwo ⭐</h2>
          <p class="pokemon-type">Tipo: <span class="badge psychic">Psíquico</span></p>
          <p class="pokemon-evo">Región: <strong>Kanto</strong></p>
          <p class="pokemon-stats">⚔️ Ataque: 110 | 🛡️ Defensa: 90</p>
        </div>
      </article>

      <!-- Lugia -->
      <article class="card legendary">
        <div class="card-image">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/249.png" alt="Lugia">
        </div>
        <div class="card-body">
          <h2 class="pokemon-name">Lugia ⭐</h2>
          <p class="pokemon-type">Tipo: 
            <span class="badge psychic">Psíquico</span>
            <span class="badge flying">Volador</span>
          </p>
          <p class="pokemon-evo">Región: <strong>Johto</strong></p>
          <p class="pokemon-stats">⚔️ Ataque: 90 | 🛡️ Defensa: 130</p>
        </div>
      </article>

      <!-- Rayquaza -->
      <article class="card legendary">
        <div class="card-image">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/384.png" alt="Rayquaza">
        </div>
        <div class="card-body">
          <h2 class="pokemon-name">Rayquaza ⭐</h2>
          <p class="pokemon-type">Tipo: 
            <span class="badge dragon">Dragón</span>
            <span class="badge flying">Volador</span>
          </p>
          <p class="pokemon-evo">Región: <strong>Hoenn</strong></p>
          <p class="pokemon-stats">⚔️ Ataque: 150 | 🛡️ Defensa: 90</p>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
